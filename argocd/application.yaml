apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memory-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: memory-app
    app.kubernetes.io/part-of: memory-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vijaykumarcm1991/devops-sre-p1.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: memory-app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
