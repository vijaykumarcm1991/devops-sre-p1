apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kube-prometheus-alertmanager
  namespace: observability
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: 'slack-and-email-notifications'
      routes:
        - match:
            service: memory-app
          receiver: 'slack-and-email-notifications'
          continue: true

    receivers:
      - name: 'slack-and-email-notifications'
        slack_configs:
          - channel: '#alerts-sre'
            api_url: 'https://example.com/slack-webhook-placeholder'
            send_resolved: true
            icon_emoji: ':fire:'
            title: '{{ template "slack.default.title" . }}'
            text: >-
              *Alert:* {{ .CommonAnnotations.summary }}
              *Severity:* `{{ .CommonLabels.severity }}`
              *Description:* {{ .CommonAnnotations.description }}
              *Namespace:* `{{ .CommonLabels.namespace }}`
              *Pod:* `{{ .CommonLabels.pod }}`
        email_configs:
          - to: 'sre-team@example.com'
            from: 'alertmanager@cluster.local'
            smarthost: 'smtp.example.com:587'
            auth_username: 'alertmanager'
            auth_password: 'smtp_password'
            send_resolved: true
