# Helm values for kube-prometheus-stack deployment
fullnameOverride: "kube-prometheus"

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    k8s: true
    kubeApiserver: true
    kubePrometheusNodeAlerting: true
    kubeStateMetrics: true
    node: true
    prometheus: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h

grafana:
  enabled: true
  adminPassword: "prom-operator"
  service:
    type: ClusterIP
    port: 3000
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
      jsonData:
        maxLines: 1000

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
