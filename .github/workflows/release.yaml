name: Release & GitOps Manifest Update Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - '*.md'
      - '.github/**'

permissions:
  contents: write
  packages: write

jobs:
  build-matrix-images:
    name: Build & Push Image Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [v1.0.0, v1.1.0, v1.2.0]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        id: repo_name
        run: |
          echo "image_repo=ghcr.io/${{ github.repository_owner }}/memory-app" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Build and Push Versioned Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.repo_name.outputs.image_repo }}:${{ matrix.version }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  update-gitops-manifests:
    name: Update GitOps Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-matrix-images
    steps:
      - name: Checkout Repository with Write Access
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        id: repo_name
        run: |
          echo "image_repo=ghcr.io/${{ github.repository_owner }}/memory-app" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Update Deployment Image Tags
        run: |
          IMAGE_BASE="${{ steps.repo_name.outputs.image_repo }}"
          sed -i "s|image: .*memory-app:v1.0.0.*|image: ${IMAGE_BASE}:v1.0.0|g" k8s/deployments.yaml
          sed -i "s|image: .*memory-app:v1.1.0.*|image: ${IMAGE_BASE}:v1.1.0|g" k8s/deployments.yaml
          sed -i "s|image: .*memory-app:v1.2.0.*|image: ${IMAGE_BASE}:v1.2.0|g" k8s/deployments.yaml

      - name: Commit and Push Updated Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet k8s/; then
            git add k8s/
            git commit -m "chore(gitops): auto-update deployment image tags [skip ci]"
            git push
          else
            echo "No manifest changes detected."
          fi
