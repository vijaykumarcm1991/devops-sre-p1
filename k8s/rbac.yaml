apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-app-sa
  namespace: memory-app-prod
  labels:
    app.kubernetes.io/name: memory-app
    app.kubernetes.io/component: service-account
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memory-app-role
  namespace: memory-app-prod
  labels:
    app.kubernetes.io/name: memory-app
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memory-app-rolebinding
  namespace: memory-app-prod
  labels:
    app.kubernetes.io/name: memory-app
subjects:
  - kind: ServiceAccount
    name: memory-app-sa
    namespace: memory-app-prod
roleRef:
  kind: Role
  name: memory-app-role
  apiGroup: rbac.authorization.k8s.io
