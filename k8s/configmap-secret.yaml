apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-app-config
  namespace: memory-app-prod
  labels:
    app.kubernetes.io/name: memory-app
data:
  APP_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "INFO"
  MEMORY_INCREMENT_DURATION: "120"
  HEALTHCHECK_PATH: "/healthcheck"
---
apiVersion: v1
kind: Secret
metadata:
  name: memory-app-secret
  namespace: memory-app-prod
  labels:
    app.kubernetes.io/name: memory-app
type: Opaque
stringData:
  APP_SECRET_KEY: "prod-memory-service-super-secret-key"
  METRICS_TOKEN: "internal-metrics-bearer-token-12345"
