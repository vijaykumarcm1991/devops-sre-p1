apiVersion: v1
kind: Service
metadata:
  name: memory-app-service
  namespace: memory-app-prod
  labels:
    app: memory-app
    app.kubernetes.io/name: memory-app
    app.kubernetes.io/component: load-balancer
spec:
  type: ClusterIP
  selector:
    # Selects all 3 deployments simultaneously, routing traffic evenly across v1.0.0, v1.1.0, and v1.2.0
    app: memory-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
