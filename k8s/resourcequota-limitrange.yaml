apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory-app-quota
  namespace: memory-app-prod
  labels:
    app.kubernetes.io/name: memory-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: memory-app-limitrange
  namespace: memory-app-prod
  labels:
    app.kubernetes.io/name: memory-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 150Mi
      default:
        cpu: 500m
        memory: 400Mi
      max:
        cpu: "1"
        memory: 600Mi
      min:
        cpu: 50m
        memory: 64Mi
